name: Lighthouse budgets (post-deploy)

# Performance budgets, asserted against the LIVE site after each deploy:
#   LCP < 2.0s · CLS < 0.05 · TBT < 150ms  (desktop preset, median of 3 runs)
# on /, /pricing/, /book/, and /score/ — see lighthouserc.json. A regression
# fails this workflow loudly. Runs after the Pages deploy lands (same delay
# pattern as the smoke test), and on demand: gh workflow run lighthouse.yml

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Give the Cloudflare Pages deploy time to land before measuring.
      - name: Wait for deploy
        run: sleep 180
      - name: Run Lighthouse CI (desktop)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      # MOBILE, added 2026-08-09. The desktop-only budget is why a 1.37MB PNG
      # cover on a blog post sat at LCP 9.64s without ever failing a build:
      # the blog template was not in the URL list AND mobile was never
      # measured. Mobile thresholds are the Core Web Vitals "good" line
      # (LCP 2.5s / CLS 0.1), deliberately looser than the desktop budget.
      - name: Run Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.mobile.json
