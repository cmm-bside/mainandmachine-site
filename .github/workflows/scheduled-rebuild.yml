name: Scheduled static rebuild

# Main & Machine's production site is built by the Cloudflare Pages native
# Git integration. Blog posts are pulled only during that native build, so a
# publish in Beehiiv or Soro needs a new Cloudflare build before it is live.
#
# This workflow deliberately does not check out code, build, or deploy. It
# only POSTs the existing production-branch Deploy Hook so Cloudflare follows
# the same single build path used for every normal production deploy.
#
# Existing one-time setup:
#   Cloudflare Pages -> Settings -> Builds & deployments -> Deploy hooks
#   GitHub -> Settings -> Secrets and variables -> Actions
#   Repository secret: CF_DEPLOY_HOOK_URL

on:
  schedule:
    # Eight builds/day (~240/month). Minute 23 avoids top-of-hour congestion.
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-static-rebuild
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    name: Trigger Cloudflare production rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Fire Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          set -eu
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "::error::CF_DEPLOY_HOOK_URL secret is not set. Add the production-branch Cloudflare Pages Deploy Hook URL as a GitHub Actions repository secret."
            exit 1
          fi

          status=$(curl --silent --show-error --output /tmp/deploy-hook-response.json --write-out '%{http_code}' --request POST "${DEPLOY_HOOK_URL}")
          case "${status}" in
            2??)
              echo "Cloudflare accepted the production rebuild request (HTTP ${status})."
              ;;
            *)
              echo "::error::Cloudflare deploy hook returned HTTP ${status}; no build was triggered by this workflow."
              exit 1
              ;;
          esac
